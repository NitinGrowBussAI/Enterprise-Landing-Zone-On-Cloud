<svg width="100%" viewBox="0 0 680 404" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Deployment bootstrap sequence</title>
<desc>Five-step sequence from local Terraform bootstrap to a live stack behind CloudFront.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  rect { stroke-width: 1; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #2C2C2A; }
  .c-gray .ts { fill: #444441; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th { fill: #042C53; }
  .c-blue .ts { fill: #0C447C; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #04342C; }
  .c-teal .ts { fill: #085041; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g class="c-gray"><rect x="190" y="20" width="300" height="56" rx="8"/><text class="th" x="340" y="42" text-anchor="middle">Local bootstrap</text><text class="ts" x="340" y="60" text-anchor="middle">terraform init -backend=false</text></g>
<line x1="340" y1="76" x2="340" y2="100" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="170" y="100" width="340" height="56" rx="8"/><text class="th" x="340" y="122" text-anchor="middle">Bootstrap state backend</text><text class="ts" x="340" y="140" text-anchor="middle">Creates state bucket + lock table</text></g>
<line x1="340" y1="156" x2="340" y2="180" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="150" y="180" width="380" height="56" rx="8"/><text class="th" x="340" y="202" text-anchor="middle">Migrate to remote state</text><text class="ts" x="340" y="220" text-anchor="middle">terraform init -migrate-state</text></g>
<line x1="340" y1="236" x2="340" y2="260" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="140" y="260" width="400" height="56" rx="8"/><text class="th" x="340" y="282" text-anchor="middle">Apply full stack</text><text class="ts" x="340" y="300" text-anchor="middle">Provisions networking, compute, data &amp; edge</text></g>
<line x1="340" y1="316" x2="340" y2="340" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="210" y="340" width="260" height="44" rx="8"/><text class="th" x="340" y="366" text-anchor="middle">App live behind CloudFront</text></g>
</svg>
