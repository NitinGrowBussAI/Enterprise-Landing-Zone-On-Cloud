<svg width="100%" viewBox="0 0 680 666" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Enterprise landing zone architecture</title>
<desc>Vertical flow from Internet through CloudFront, WAF, ALB, Auto Scaling Group, and RDS, with a cross-cutting services box at the bottom.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  rect { stroke-width: 1; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #2C2C2A; }
  .c-gray .ts { fill: #444441; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th { fill: #042C53; }
  .c-blue .ts { fill: #0C447C; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #4A1B0C; }
  .c-coral .ts { fill: #712B13; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #04342C; }
  .c-teal .ts { fill: #085041; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #26215C; }
  .c-purple .ts { fill: #3C3489; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g class="c-gray"><rect x="240" y="20" width="200" height="44" rx="8"/><text class="th" x="340" y="46" text-anchor="middle">Internet</text></g>
<line x1="340" y1="64" x2="340" y2="100" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="190" y="100" width="300" height="56" rx="8"/><text class="th" x="340" y="122" text-anchor="middle">CloudFront</text><text class="ts" x="340" y="140" text-anchor="middle">CDN + edge caching, TLS</text></g>
<line x1="340" y1="156" x2="340" y2="192" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral"><rect x="190" y="192" width="300" height="56" rx="8"/><text class="th" x="340" y="214" text-anchor="middle">AWS WAF</text><text class="ts" x="340" y="232" text-anchor="middle">Managed rules + rate limit</text></g>
<line x1="340" y1="248" x2="340" y2="284" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="190" y="284" width="300" height="56" rx="8"/><text class="th" x="340" y="306" text-anchor="middle">ALB (public subnets)</text><text class="ts" x="340" y="324" text-anchor="middle">Multi-AZ, HTTPS listener</text></g>
<line x1="340" y1="340" x2="340" y2="376" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="190" y="376" width="300" height="56" rx="8"/><text class="th" x="340" y="398" text-anchor="middle">Auto scaling group</text><text class="ts" x="340" y="416" text-anchor="middle">Private EC2, no public IP</text></g>
<line x1="340" y1="432" x2="340" y2="468" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="190" y="468" width="300" height="56" rx="8"/><text class="th" x="340" y="490" text-anchor="middle">RDS multi-AZ</text><text class="ts" x="340" y="508" text-anchor="middle">Isolated subnet, encrypted</text></g>
<line x1="340" y1="524" x2="340" y2="560" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
  <rect x="60" y="560" width="560" height="86" rx="12"/>
  <text class="th" x="340" y="584" text-anchor="middle">Cross-cutting services</text>
  <text class="ts" x="340" y="604" text-anchor="middle">S3 &#183; IAM &#183; Secrets Manager &#183; CloudWatch</text>
  <text class="ts" x="340" y="620" text-anchor="middle">Route 53 &#183; ACM &#183; AWS Organizations</text>
</g>
</svg>
